[project]
name = "symbolon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cbor2>=5.6",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.0", "ruff>=0.16", "rns>=1.5"]
reticulum = ["rns>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff.lint]
select = ["ARG", "F401", "F811"]
